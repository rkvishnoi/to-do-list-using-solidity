version: "3.9"

services:
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm ci || npm install && npm run dev"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=devsecret
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - arcads

  backend:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./backend:/app
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/arcads
      - REDIS_URL=redis://redis:6379/0
      - AWS_REGION=us-east-1
      - S3_BUCKET=arcads
      - S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - CORS_ORIGINS=http://localhost:3000
      - OPENAI_API_KEY=
      - ELEVENLABS_API_KEY=
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
      - minio
    networks:
      - arcads

  worker:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./backend:/app
    command: sh -c "pip install -r requirements.txt && python -m app.workers.worker"
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/arcads
      - REDIS_URL=redis://redis:6379/0
      - AWS_REGION=us-east-1
      - S3_BUCKET=arcads
      - S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    depends_on:
      - backend
      - db
      - redis
      - minio
    networks:
      - arcads

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=arcads
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - arcads

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - arcads

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - arcads

networks:
  arcads:
    driver: bridge

volumes:
  pgdata:
  minio-data: